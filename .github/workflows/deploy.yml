name: CI Pipeline

on:
  push:
    branches:
      - master
      - feature

jobs:

  lint-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint
        uses: Cyb3r-Jak3/html5validator-action@v7
        with:
          root: .

  github-pages:
    if: github.ref == 'refs/heads/master'
    needs: lint-html
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4

  docker-push:
    needs: lint-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/si-2026-lab3:${GITHUB_REF_NAME}-latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/si-2026-lab3:${GITHUB_REF_NAME}-latest
